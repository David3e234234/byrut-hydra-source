name: Update byrut.json

on:
  schedule:
    - cron: "0 3 * * *" # каждый день в 03:00 UTC
  workflow_dispatch: {} # кнопка "Run workflow" в UI

permissions:
  contents: write

concurrency:
  group: update-byrut
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Scrape
        run: node scrape.mjs --pages 5

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add byrut.json .cache/downloads.json
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore: update byrut.json ($(date -u +%Y-%m-%d))"
            git push
          fi
